<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">NexusFlow AI Command Center</title>
  <desc id="desc">Animated futuristic dashboard banner for NexusFlow AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A16"/>
      <stop offset="0.48" stop-color="#11172B"/>
      <stop offset="1" stop-color="#090B18"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.44" stop-color="#A5B4FC"/>
      <stop offset="0.74" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="chartGradient" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="orbA">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="chartClip"><rect x="710" y="302" width="390" height="112" rx="18"/></clipPath>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="28" fill="url(#grid)" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="12s" repeatCount="indefinite"/>
  </rect>

  <circle cx="140" cy="110" r="220" fill="url(#orbA)" filter="url(#blur40)">
    <animate attributeName="cx" values="140;250;140" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="110;165;110" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="360" r="250" fill="url(#orbB)" filter="url(#blur40)">
    <animate attributeName="cx" values="1040;930;1040" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="360;285;360" dur="12s" repeatCount="indefinite"/>
  </circle>

  <rect x="35" y="35" width="1130" height="450" rx="24" fill="#FFFFFF" fill-opacity="0.025" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <rect x="60" y="60" width="1080" height="38" rx="12" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <circle cx="84" cy="79" r="5" fill="#FB7185"/>
  <circle cx="102" cy="79" r="5" fill="#FBBF24"/>
  <circle cx="120" cy="79" r="5" fill="#34D399"/>
  <rect x="470" y="71" width="260" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.055"/>
  <circle cx="1114" cy="79" r="7" fill="#22D3EE">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(85 132)">
    <rect width="70" height="70" rx="20" fill="#FFFFFF" fill-opacity="0.07" stroke="#A78BFA" stroke-opacity="0.42"/>
    <path d="M21 49V22h8l12 16V22h8v27h-8L29 33v16z" fill="url(#titleGradient)"/>
    <circle cx="56" cy="16" r="5" fill="#22D3EE" filter="url(#glow)">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="180" y="164" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="4">ENTERPRISE INTELLIGENCE PLATFORM</text>
  <text x="180" y="219" fill="url(#titleGradient)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="55" font-weight="800" letter-spacing="-2">NexusFlow AI</text>
  <text x="180" y="259" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600">Intelligent operations. One unified command center.</text>
  <text x="180" y="290" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Revenue · Projects · Risks · Teams · AI-generated decisions</text>

  <g transform="translate(82 329)">
    <rect width="186" height="88" rx="18" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="18" y="27" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">MONTHLY REVENUE</text>
    <text x="18" y="59" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">$1.28M</text>
    <text x="126" y="59" fill="#34D399" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">+18.4%</text>
  </g>
  <g transform="translate(284 329)">
    <rect width="186" height="88" rx="18" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="18" y="27" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">AI CONFIDENCE</text>
    <text x="18" y="59" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">96%</text>
    <circle cx="150" cy="51" r="12" fill="#8B5CF6" fill-opacity="0.22"/>
    <circle cx="150" cy="51" r="5" fill="#A78BFA" filter="url(#glow)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(486 329)">
    <rect width="186" height="88" rx="18" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="18" y="27" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">PROJECT DELIVERY</text>
    <text x="18" y="59" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">87%</text>
    <rect x="104" y="46" width="62" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="104" y="46" width="54" height="8" rx="4" fill="#22D3EE">
      <animate attributeName="width" values="8;54;54" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g>
    <rect x="710" y="130" width="390" height="150" rx="20" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="734" y="160" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">NEXUS AI · LIVE</text>
    <circle cx="1070" cy="154" r="5" fill="#34D399">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="734" y="198" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Revenue is accelerating.</text>
    <text x="734" y="226" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Enterprise conversions improved by 27%.</text>
    <text x="734" y="250" fill="#A78BFA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">Recommended → Scale high-intent campaigns</text>
  </g>

  <g clip-path="url(#chartClip)">
    <rect x="710" y="302" width="390" height="112" rx="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M710 414 L710 390 C748 388 754 373 785 378 C819 384 826 345 857 354 C892 364 902 329 933 338 C966 347 986 308 1016 318 C1047 328 1065 294 1100 306 L1100 414 Z" fill="url(#chartGradient)"/>
    <path d="M710 390 C748 388 754 373 785 378 C819 384 826 345 857 354 C892 364 902 329 933 338 C966 347 986 308 1016 318 C1047 328 1065 294 1100 306" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="520" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="520;0;0" dur="4s" repeatCount="indefinite"/>
    </path>
    <line x1="710" y1="306" x2="1100" y2="306" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 102;0 0" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="4.8s" repeatCount="indefinite"/>
    </line>
  </g>

  <text x="82" y="462" fill="#475569" font-family="JetBrains Mono,Consolas,monospace" font-size="12">BUILT WITH REACT 19 · TANSTACK START · TYPESCRIPT · TAILWIND CSS · FRAMER MOTION</text>
</svg>
